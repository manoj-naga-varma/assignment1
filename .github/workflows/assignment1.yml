name: File Processing

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-file:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create input/data.txt
      - name: Create input file
        run: |
          mkdir -p input
          echo "Hello from GitHub Actions!" > input/data.txt
          echo "This is sample data for file processing." >> input/data.txt
          echo "File processing workflow completed successfully." >> input/data.txt

      # 3. Create output directory and copy the file
      - name: Copy file to output
        run: |
          mkdir -p output
          cp input/data.txt output/data.txt

      # 4. Rename data.txt to processed.txt
      - name: Rename file
        run: |
          mv output/data.txt output/processed.txt

      # 5. Print file contents in workflow logs
      - name: Print processed file contents
        run: |
          echo "===== processed.txt ====="
          cat output/processed.txt

      # 6. Show directory structure
      - name: Show generated files
        run: |
          echo "===== Repository Structure ====="
          find input output -type f -print

      # 7. Upload processed.txt as an artifact
      - name: Upload processed file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-file
          path: output/processed.txt

      # 8. Commit generated files back to GitHub
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add input/data.txt output/processed.txt

          git diff --cached --quiet || git commit -m "Add processed files"

          git push
